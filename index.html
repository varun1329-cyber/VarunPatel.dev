<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varun Patel | Self-Taught iOS Developer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter & SF Pro style Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            apple: {
              bg: '#f5f5f7',
              darkBg: '#0b0c0e',
              cardLight: 'rgba(255, 255, 255, 0.75)',
              cardDark: 'rgba(22, 24, 29, 0.75)',
              accent: '#0071e3',
              accentHover: '#0077ed',
              glassBorderLight: 'rgba(255, 255, 255, 0.8)',
              glassBorderDark: 'rgba(255, 255, 255, 0.12)'
            }
          },
          boxShadow: {
            'apple-glass': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 15px rgba(255, 255, 255, 0.5) inset',
            'apple-glass-dark': '0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(255, 255, 255, 0.1) inset',
            'glow': '0 0 25px -5px rgba(0, 113, 227, 0.4)',
            'macbook': '0 30px 60px -12px rgba(0, 0, 0, 0.25), 0 0 30px rgba(0, 113, 227, 0.15)'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Backdrop Blur and Apple Glass Effects */
    .glass-panel {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .dark .glass-panel {
      background: rgba(20, 22, 27, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .macbook-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(240, 245, 255, 0.5) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }
    .dark .macbook-glass {
      background: linear-gradient(135deg, rgba(30, 34, 45, 0.85) 0%, rgba(15, 18, 25, 0.6) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }

    /* Subtle grid background */
    .bg-apple-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
    }
    .dark .bg-apple-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(150, 150, 150, 0.5);
    }

    /* Shimmer Effect */
    @keyframes shine {
      100% { transform: translateX(100%); }
    }
    .shimmer {
      position: relative;
      overflow: hidden;
    }
    .shimmer::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.2) 20%,
        rgba(255, 255, 255, 0.5) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shine 3.5s infinite;
      content: '';
    }
  </style>
</head>
<body class="bg-apple-bg dark:bg-apple-darkBg text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-full font-sans bg-apple-grid flex flex-col justify-between">

  <!-- Top Navigation / Pill Bar -->
  <header class="sticky top-0 z-50 pt-4 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between glass-panel rounded-full px-5 py-3 shadow-apple-glass dark:shadow-apple-glass-dark">
      
      <!-- Brand Logo / Name -->
      <a href="#" onclick="event.preventDefault();" class="flex items-center gap-3 group">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-semibold text-sm shadow-sm group-hover:scale-105 transition-transform duration-200">
          VP
        </div>
        <span class="font-semibold text-sm tracking-tight text-slate-900 dark:text-white">Varun Patel</span>
      </a>

      <!-- Quick Project Links (Right Top Pill Items) -->
      <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-medium">
        <a href="#" onclick="event.preventDefault();" class="px-3 py-1.5 rounded-full bg-slate-200/60 dark:bg-slate-800/60 hover:bg-slate-300/80 dark:hover:bg-slate-700/80 transition flex items-center gap-2 text-slate-700 dark:text-slate-200">
          <span class="font-semibold">EasyList</span>
        </a>
        <a href="#" onclick="event.preventDefault();" class="px-3 py-1.5 rounded-full bg-slate-200/60 dark:bg-slate-800/60 hover:bg-slate-300/80 dark:hover:bg-slate-700/80 transition flex items-center gap-2 text-slate-700 dark:text-slate-200">
          <span class="font-semibold">TripMate</span>
        </a>

        <!-- Dark / Light Mode Switcher -->
        <button id="themeToggle" class="w-8 h-8 rounded-full bg-slate-200/80 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 transition flex items-center justify-center ml-1 text-slate-700 dark:text-slate-200" aria-label="Toggle color mode">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 w-full space-y-8">

    <!-- Header / Hero Section -->
    <section class="text-center space-y-2 pt-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950/50 text-apple-accent dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 text-xs font-medium tracking-wide uppercase">
        <i class="fa-solid fa-sparkles text-xs"></i> Portfolio 2026 Showcase
      </div>
      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-slate-900 dark:text-white">
        Varun Patel: The Craft of Self-Taught Development
      </h1>
      <p class="text-base sm:text-xl font-medium text-slate-500 dark:text-slate-400 tracking-tight">
        iOS Developer <span class="mx-1.5 opacity-40">•</span> Since 2025
      </p>
    </section>

    <!-- Main Central Showcase Layout (Grid with Avatar & Glass MacBook M5) -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
      
      <!-- Left Panel: Technical Capabilities & Stack -->
      <div class="lg:col-span-3 glass-panel rounded-3xl p-6 flex flex-col justify-between shadow-apple-glass dark:shadow-apple-glass-dark">
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
            <h2 class="text-base font-semibold tracking-tight flex items-center gap-2">
              <i class="fa-solid fa-layer-group text-apple-accent"></i> Technical Stack
            </h2>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-mono">5 Core</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

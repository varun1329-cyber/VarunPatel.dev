<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyList — One Focused Checklist for iPhone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appleBg: '#f5f5f7',
                        appleDarkBg: '#000000',
                        appleCardBg: '#ffffff',
                        appleAccent: '#0071e3',
                        appleAccentHover: '#0077ed',
                        appleText: '#1d1d1f',
                        appleSecText: '#86868b',
                        appleBorder: '#e5e5ea',
                        greenColor: '#28774a',
                        greenLight: '#e9f5ee',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'apple-card': '0 4px 20px 0 rgba(0, 0, 0, 0.05)',
                        'apple-hover': '0 10px 30px 0 rgba(0, 0, 0, 0.08)',
                        'phone-shadow': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Glassmorphism & Modern Styling */
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .phone-bezel {
            border: 12px solid #2d2d2d;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), inset 0 0 2px 2px rgba(255,255,255,0.2);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Exact app-icon styling matching index.html */
        .app-icon-header {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #e9f5ee;
            color: #28774a;
        }

        .app-icon-header svg {
            width: 20px;
            height: 20px;
        }

        .video-screen {
            border-radius: 32px;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body class="bg-appleBg text-appleText font-sans antialiased selection:bg-appleAccent selection:text-white">

    <!-- Header (Static Apple style with exact app-icon styling and plain text Home link) -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-gray-200/60 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <!-- Non-clickable Icon + Title with exact styling -->
            <div class="flex items-center space-x-3 font-semibold text-lg sm:text-xl tracking-tight">
                <div class="app-icon-header" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5 9L7 11L11 6M5 17L7 19L11 14M5 25L7 27L11 22"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M16 9H27M16 17H27M16 25H27"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>
                <span class="text-appleText font-bold">EasyList</span>
            </div>

            <!-- Plain Text Home Link -->
            <a href="index.html" class="text-sm font-medium text-appleAccent hover:underline underline-offset-4 transition-all">
                Home
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="pt-28 sm:pt-36 pb-16 sm:pb-20 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto text-center">
        <span class="text-appleAccent font-semibold text-xs sm:text-sm tracking-wide uppercase bg-blue-50 px-3.5 py-1.5 rounded-full border border-blue-100">
            SwiftUI & Local Persistence
        </span>
        <h1 class="mt-6 text-4xl sm:text-6xl lg:text-7xl font-bold tracking-tight text-appleText max-w-4xl mx-auto leading-tight">
            One focused checklist.<br class="hidden sm:inline"/> Zero clutter.
        </h1>
        <p class="mt-6 text-lg sm:text-2xl text-appleSecText max-w-2xl mx-auto font-normal leading-relaxed">
            Built for fast item entry, hands-free voice capture, smart duplicate prevention, and zero setup required. User list data stays 100% on device.
        </p>

        <!-- App iPhone Mockup Preview -->
        <div class="mt-14 sm:mt-16 relative max-w-sm mx-auto app-demo-section">
            <div class="phone-bezel bg-white p-3 shadow-phone-shadow relative z-10 overflow-hidden">
                <!-- Phone Dynamic Island -->
                <div class="w-28 h-4 bg-black rounded-full mx-auto mb-3"></div>
                
                <!-- Mock iPhone Screen -->
                <div class="bg-gray-50 rounded-[32px] p-4 text-left border border-gray-100 h-[520px] flex flex-col justify-between select-none video-screen relative overflow-hidden">
                    <video
                        id="easylist-video"
                        class="absolute inset-0 w-full h-full object-cover"
                        src="./App%20Usage%20Video.mov"
                        muted
                        playsinline
                        preload="auto"
                    ></video>

                    <div class="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/20"></div>

                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-3 pt-1">
                            <div>
                                <h3 class="text-lg font-bold text-white drop-shadow-sm">EasyList</h3>
                                <p class="text-[11px] text-white/80 drop-shadow-sm">Fast, easy checklist flow</p>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <div class="w-7 h-7 rounded-full bg-white/15 backdrop-blur-sm flex items-center justify-center text-white/90 border border-white/20">
                                    <i data-lucide="ellipsis" class="w-3.5 h-3.5"></i>
                                </div>
                                <div class="w-7 h-7 rounded-full bg-white/15 backdrop-blur-sm flex items-center justify-center text-white/90 border border-white/20">
                                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="relative z-10 pt-2 border-t border-white/20 flex items-center space-x-2 mt-auto">
                        <div class="bg-white/15 backdrop-blur-md rounded-full px-3 py-2 border border-white/20 text-xs text-white/70 flex-1">
                            Add item...
                        </div>
                        <div class="w-8 h-8 rounded-full bg-appleAccent/90 text-white flex items-center justify-center shadow-sm">
                            <i data-lucide="mic" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const appVideo = document.getElementById('easylist-video');
        const appDemoSection = document.querySelector('.app-demo-section');

        function resetAndPlayVideo() {
            if (!appVideo) return;
            appVideo.muted = true;
            appVideo.playsInline = true;
            appVideo.pause();
            appVideo.currentTime = 0;
            const playPromise = appVideo.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        }

        if (appVideo && appDemoSection) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        resetAndPlayVideo();
                    } else {
                        appVideo.pause();
                    }
                });
            }, {
                threshold: 0.5,
                rootMargin: '0px 0px -8% 0px'
            });

            observer.observe(appDemoSection);
            appVideo.addEventListener('loadedmetadata', resetAndPlayVideo, { once: true });
        }
    </script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyList — One Focused Checklist for iPhone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appleBg: '#f5f5f7',
                        appleDarkBg: '#000000',
                        appleCardBg: '#ffffff',
                        appleAccent: '#0071e3',
                        appleAccentHover: '#0077ed',
                        appleText: '#1d1d1f',
                        appleSecText: '#86868b',
                        appleBorder: '#e5e5ea',
                        greenColor: '#28774a',
                        greenLight: '#e9f5ee',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'apple-card': '0 4px 20px 0 rgba(0, 0, 0, 0.05)',
                        'apple-hover': '0 10px 30px 0 rgba(0, 0, 0, 0.08)',
                        'phone-shadow': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Glassmorphism & Modern Styling */
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .phone-bezel {
            width: min(100%, 360px);
            padding: 12px;
            border-radius: 44px;
            background: linear-gradient(180deg, #1a1a1a, #090909);
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .phone-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 19.5;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 2px rgba(255,255,255,0.12);
        }

        .phone-screen video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .screen-ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.26), rgba(0,0,0,0.04) 36%, rgba(0,0,0,0.12));
            z-index: 2;
        }

        .screen-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 16px 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dynamic-island {
            width: 118px;
            height: 24px;
            border-radius: 999px;
            background: rgba(0,0,0,0.75);
            margin: 0 auto;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            z-index: 5;
        }

        .screen-title {
            margin-top: 24px;
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        .screen-subtitle {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        .screen-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-pill {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            display: grid;
            place-items: center;
            color: rgba(255,255,255,0.9);
        }

        .screen-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            padding: 14px 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.28), transparent);
        }

        .composer {
            flex: 1;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.7);
            padding: 10px 14px;
            font-size: 0.72rem;
        }

        .mic-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 113, 227, 0.9);
            color: white;
            display: grid;
            place-items: center;
            box-shadow: 0 6px 18px rgba(0, 113, 227, 0.35);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .app-icon-header {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #e9f5ee;
            color: #28774a;
        }

        .app-icon-header svg {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 480px) {
            .phone-bezel {
                width: min(100%, 320px);
            }
        }
    </style>
</head>
<body class="bg-appleBg text-appleText font-sans antialiased selection:bg-appleAccent selection:text-white">

    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-gray-200/60 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 font-semibold text-lg sm:text-xl tracking-tight">
                <div class="app-icon-header" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 9L7 11L11 6M5 17L7 19L11 14M5 25L7 27L11 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 9H27M16 17H27M16 25H27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="text-appleText font-bold">EasyList</span>
            </div>

            <a href="index.html" class="text-sm font-medium text-appleAccent hover:underline underline-offset-4 transition-all">
                Home
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="pt-28 sm:pt-36 pb-16 sm:pb-20 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto text-center">
        <span class="text-appleAccent font-semibold text-xs sm:text-sm tracking-wide uppercase bg-blue-50 px-3.5 py-1.5 rounded-full border border-blue-100">
            SwiftUI & Local Persistence
        </span>
        <h1 class="mt-6 text-4xl sm:text-6xl lg:text-7xl font-bold tracking-tight text-appleText max-w-4xl mx-auto leading-tight">
            One focused checklist.<br class="hidden sm:inline"/> Zero clutter.
        </h1>
        <p class="mt-6 text-lg sm:text-2xl text-appleSecText max-w-2xl mx-auto font-normal leading-relaxed">
            Built for fast item entry, hands-free voice capture, smart duplicate prevention, and zero setup required. User list data stays 100% on device.
        </p>

        <!-- App iPhone Mockup Preview -->
        <div class="mt-14 sm:mt-16 relative mx-auto app-demo-section" style="max-width: 360px;">
            <div class="phone-bezel shadow-phone-shadow relative z-10 mx-auto">
                <div class="phone-screen">
                    <video
                        id="easylist-video"
                        src="./App%20Usage%20Video.mov"
                        muted
                        playsinline
                        preload="auto"
                        crossorigin="anonymous"
                    ></video>

                    <div class="screen-ui"></div>
                    <div class="dynamic-island"></div>

                    <div class="screen-topbar">
              
                        <div class="screen-actions">
                            <div class="action-pill">
                                <i data-lucide="ellipsis" class="w-3.5 h-3.5"></i>
                            </div>
                            <div class="action-pill">
                                <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                            </div>
                        </div>
                    </div>

                    <div class="screen-bottom">
                        <div class="composer">Add item...</div>
                        <div class="mic-btn">
                            <i data-lucide="mic" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const appVideo = document.getElementById('easylist-video');
        const appDemoSection = document.querySelector('.app-demo-section');

        function resetAndPlayVideo() {
            if (!appVideo) return;
            appVideo.muted = true;
            appVideo.playsInline = true;
            appVideo.pause();
            appVideo.currentTime = 0;
            const playPromise = appVideo.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        }

        if (appVideo && appDemoSection) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        resetAndPlayVideo();
                    } else {
                        appVideo.pause();
                    }
                });
            }, {
                threshold: 0.5,
                rootMargin: '0px 0px -6% 0px'
            });

            observer.observe(appDemoSection);
            appVideo.addEventListener('loadedmetadata', resetAndPlayVideo, { once: true });
        }
    </script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
